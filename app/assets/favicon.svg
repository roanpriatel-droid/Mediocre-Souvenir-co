<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Mediocre Souvenir Co. — the municipal water tower, where a mountain should be -->
  <circle cx="32" cy="32" r="31" fill="#2A3D52"/>
  <circle cx="32" cy="32" r="27.75" fill="none" stroke="#F1E9D6" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#D4A64A" stroke-width="1" stroke-dasharray="1 2.6" opacity="0.9"/>
  <g stroke="#F1E9D6" stroke-linecap="round" stroke-linejoin="round">
    <!-- roof -->
    <path d="M26,16.5 L38,16.5 L42,23 L22,23 Z" fill="#B8503A" stroke-width="1.6"/>
    <!-- tank -->
    <rect x="22" y="23" width="20" height="11" fill="#F1E9D6" stroke-width="1.6"/>
    <path d="M22,28.5 L42,28.5" stroke="#2A3D52" stroke-width="1.1"/>
    <!-- legs and braces -->
    <path d="M24.5,34 L20,48.5 M39.5,34 L44,48.5" stroke-width="2" fill="none"/>
    <path d="M32,34 L32,40" stroke-width="1.6" fill="none"/>
    <path d="M22,42 L42,42" stroke-width="1.3" fill="none"/>
    <path d="M24,37 L40,47 M40,37 L24,47" stroke-width="1.1" fill="none" opacity="0.85"/>
    <!-- ground -->
    <path d="M17.5,48.5 L46.5,48.5" stroke-width="2" fill="none"/>
  </g>
</svg>
